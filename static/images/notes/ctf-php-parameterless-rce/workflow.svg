ia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.28">02</text><text x="254" y="236" fill="#0c211c" font-size="13" font-family="'MiSans','HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">确认 eval</text><text x="254" y="270" fill="#5b726a" font-size="8.5" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle">输入进入代码</text><rect x="341.333" y="190" width="126.667" height="112" rx="8" fill="#fffdf8" stroke="#0c211c" stroke-width="1" stroke-opacity="0.28"/><rect x="349.333" y="198" width="38" height="14" rx="2" fill="none" stroke="#0c211c" stroke-width="0.8" stroke-opacity="0.28"/><text x="368.333" y="208" fill="#0c211c" font-size="7" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.28">03</text><text x="404.667" y="236" fill="#0c211c" font-size="13" font-family="'MiSans','HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">get_defined_vars</text><text x="404.667" y="270" fill="#5b726a" font-size="8.5" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle">拿到超全局变量</text><rect x="492" y="190" width="126.667" height="112" rx="8" fill="#fffdf8" stroke="#0c211c" stroke-width="1" stroke-opacity="0.28"/><rect x="500" y="198" width="38" height="14" rx="2" fill="none" stroke="#0c211c" stroke-width="0.8" stroke-opacity="0.28"/><text x="519" y="208" fill="#0c211c" font-size="7" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.28">04</text><text x="555.333" y="236" fill="#0c211c" font-size="13" font-family="'MiSans','HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">current / end</text><text x="555.333" y="270" fill="#5b726a" font-size="8.5" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle">取最后一个参数</text><rect x="642.667" y="190" width="126.667" height="112" rx="8" fill="#fffdf8" stroke="#0c211c" stroke-width="1" stroke-opacity="0.28"/><rect x="650.667" y="198" width="38" height="14" rx="2" fill="none" stroke="#0c211c" stroke-width="0.8" stroke-opacity="0.28"/><text x="669.667" y="208" fill="#0c211c" font-size="7" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.28">05</text><text x="706" y="236" fill="#0c211c" font-size="13" font-family="'MiSans','HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">嵌套 eval</text><text x="706" y="270" fill="#5b726a" font-size="8.5" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle">system(&#x27;cat /flag&#x27;)</text><rect x="793.333" y="190" width="126.667" height="112" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="1" fill-opacity="0.08"/><rect x="801.333" y="198" width="38" height="14" rx="2" fill="none" stroke="#0f766e" stroke-width="0.8"/><text x="820.333" y="208" fill="#0f766e" font-size="7" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.08em">06</text><text x="856.667" y="236" fill="#0c211c" font-size="13" font-family="'MiSans','HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">验证 flag</text><text x="856.667" y="270" fill="#5b726a" font-size="8.5" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle">响应与文件双证</text>
      
