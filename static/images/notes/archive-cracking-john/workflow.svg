<rect x="40" y="344" width="3" height="56" rx="1.5" fill="#0f766e"/>
<text x="60" y="366" fill="#0f766e" font-size="8" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="start" letter-spacing="0.14em">关键判断</text>
<text x="60" y="388" fill="#0c211c" font-size="13" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" text-anchor="start">先确认 hash 类型，再选 hashcat 模式；跑完必须回解压缩包验证。</text>
      
