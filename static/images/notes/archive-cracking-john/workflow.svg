onyOS Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">提取哈希</text><text x="296.4" y="270" fill="#5b726a" font-size="8.5" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle">zip2john / 7z2john</text><rect x="407.2" y="190" width="145.6" height="112" rx="8" fill="#fffdf8" stroke="#0c211c" stroke-width="1" stroke-opacity="0.28"/><rect x="415.2" y="198" width="38" height="14" rx="2" fill="none" stroke="#0c211c" stroke-width="0.8" stroke-opacity="0.28"/><text x="434.2" y="208" fill="#0c211c" font-size="7" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.28">03</text><text x="480" y="236" fill="#0c211c" font-size="13" font-family="'MiSans','HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">识别模式</text><text x="480" y="270" fill="#5b726a" font-size="8.5" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle">hashcat --identify</text><rect x="590.8" y="190" width="145.6" height="112" rx="8" fill="#fffdf8" stroke="#0c211c" stroke-width="1" stroke-opacity="0.28"/><rect x="598.8" y="198" width="38" height="14" rx="2" fill="none" stroke="#0c211c" stroke-width="0.8" stroke-opacity="0.28"/><text x="617.8" y="208" fill="#0c211c" font-size="7" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.28">04</text><text x="663.6" y="236" fill="#0c211c" font-size="13" font-family="'MiSans','HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">字典攻击</text><text x="663.6" y="270" fill="#5b726a" font-size="8.5" font-family="'Cascadia Mono','Cascadia Code','Consolas','Liberation Mono',monospace" text-anchor="middle">wordlist + rules</text><rect x="774.4" y="190