# 漩涡 / xuanwo
# 临时使用服务器 IP；绑定域名后请同步修改 baseURL。
baseURL: "http://47.93.123.112/"
title: "漩涡 · xuanwo"
copyright: "© 2026 xuanwo · 记录代码、安全与思考"
theme: ["PaperMod"]

locale: "zh-CN"
defaultContentLanguage: "zh"
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
timeZone: "Asia/Shanghai"

enableRobotsTXT: true
enableEmoji: true
enableInlineShortcodes: false
enableGitInfo: false
buildDrafts: false
buildFuture: false
buildExpired: false
summaryLength: 90

pagination:
  disableAliases: false
  pagerSize: 12

# PaperMod 搜索页依赖首页 JSON 索引。
outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
  term:
    - HTML
  page:
    - HTML

taxonomies:
  category: categories
  tag: tags
  series: series

permalinks:
  notes: "/notes/:slug/"
  projects: "/projects/:slug/"
  posts: "/posts/:year/:month/:slug/"

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
    - identifier: projects
      name: 项目
      url: /projects/
      weight: 20
    - identifier: notes
      name: 笔记
      url: /notes/
      weight: 30
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50

params:
  env: production
  description: "漩涡是 xuanwo 的个人安全博客，记录 CTF Writeups、漏洞复现、内网渗透、密码学实验与网络编程。"
  author: "xuanwo"
  keywords:
    - 网络安全
    - CTF
    - Writeup
    - 漏洞复现
    - 内网渗透
    - 密码学
    - xuanwo
  images:
    - images/og-cover.png

  mainSections:
    - notes
    - posts

  # 默认深色主题，同时保留右上角明暗切换。
  defaultTheme: dark
  # 关闭 PaperMod 自带的内联主题脚本；本站由 assets/js/bootstrap.js 完成首屏主题初始化。
  disableThemeToggle: true

  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: false
  ShowPageNums: true
  ShowToc: true
  TocOpen: true
  ShowLastmod: true
  ShowFullTextinRSS: false
  DateFormat: "2006-01-02"
  hideAuthor: false
  hideFooter: false
  comments: false

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/xuanwoLQL"
    - name: rss
      title: RSS 订阅
      url: "index.xml"

  label:
    text: "漩涡"
    icon: "/favicon.svg"
    iconHeight: 28

  assets:
    disableHLJS: true
    favicon: "/favicon.svg"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
    theme_color: "#090c0b"
    msapplication_TileColor: "#090c0b"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.35
    minMatchCharLength: 1
    keys:
      - title
      - permalink
      - summary
      - content

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      strikethrough: true
      table: true
      taskList: true
      typographer: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: "github-dark"
  tableOfContents:
    startLevel: 2
    endLevel: 2
    ordered: false

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml
